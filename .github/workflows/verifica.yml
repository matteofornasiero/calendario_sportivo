name: Verifica Sport OS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt
      - name: Verifica la sintassi Python
        run: python -m py_compile aggiorna_calendario.py verifica_dati.py monitor_salute.py genera_abbonamenti.py tests/test_italy.py tests/test_maintenance.py tests/test_abbonamenti.py
      - name: Test automatici Python e UI
        run: |
          python -m unittest discover -s tests -v
          node tests/test_app.cjs
          python verifica_dati.py
